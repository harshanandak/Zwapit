name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    timeout-minutes: 10
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: bun run check

      - name: Convex type check
        run: bunx tsc --project convex/tsconfig.json --noEmit

  build:
    timeout-minutes: 20
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

  route-coverage:
    timeout-minutes: 10
    name: Route coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Route coverage
        run: bun run check:routes

  tests:
    timeout-minutes: 20
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Unit and acceptance tests
        run: bun test

  acceptance:
    timeout-minutes: 25
    name: Acceptance verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Acceptance verification
        run: bun scripts/verify-first-visible-slice.mjs

  smoke:
    timeout-minutes: 15
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Buyer and seller smoke checks
        run: |
          bun scripts/e2e-buyer.mjs
          bun scripts/e2e-seller.mjs
          bun scripts/ui-smoke-buyer.mjs
          bun scripts/ui-smoke-seller.mjs

  audit:
    timeout-minutes: 10
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

  coderabbit:
    timeout-minutes: 10
    name: Request CodeRabbit review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs:
      - type-check
      - build
      - route-coverage
      - tests
      - acceptance
      - smoke
      - audit
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    steps:
      - name: Request review after CI passes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "@coderabbitai review\n\nCI passed for this commit, so CodeRabbit can review now."
            });

  coderabbit-gate:
    timeout-minutes: 35
    name: AI review gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    needs:
      - coderabbit
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    steps:
      - name: Wait for a 10-minute quiet period after the last PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // Merge block: succeed only once 10 minutes have passed with NO new
            // PR activity (reviews, issue comments, inline review comments).
            // Automated reviewers (CodeRabbit, Codex) post within that window,
            // so a quiet period means delivery has settled. Combined with the
            // branch-level conversation-resolution rule, any findings must be
            // addressed before merge. Hard cap ~30 min regardless of chatter.
            const QUIET_MS = 10 * 60 * 1000;
            const CAP_MS = 30 * 60 * 1000;
            const started = Date.now();
            const number = context.issue.number ?? context.payload.pull_request.number;
            const lastActivity = async () => {
              let latest = 0;
              const bump = (t) => {
                const ms = Date.parse(t);
                if (Number.isFinite(ms) && ms > latest) latest = ms;
              };
              const reviews = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                per_page: 100,
              });
              for (const r of reviews.data) bump(r.submitted_at);
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              });
              for (const c of comments.data) bump(c.created_at);
              const inline = await github.rest.pulls.listReviewComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                per_page: 100,
              });
              for (const c of inline.data) bump(c.created_at);
              return latest || started;
            };
            while (Date.now() - started < CAP_MS) {
              const quietFor = Date.now() - (await lastActivity());
              if (quietFor >= QUIET_MS) {
                core.info(`Quiet for ${Math.round(quietFor / 60000)} min — delivery settled, gate open.`);
                return;
              }
              core.info(`Last activity ${Math.round(quietFor / 60000)} min ago — waiting for ${10} min quiet.`);
              await new Promise((r) => setTimeout(r, 30000));
            }
            core.setFailed("Review gate timed out after 30 min of continuous PR activity — merge blocked.");
